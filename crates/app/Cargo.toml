[package]
name = "analytics-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
analytics-workflow = { path = "../workflow" }
rfd = "0.15"
serde.workspace = true
analytics-core = { path = "../core" }
analytics-engine = { path = "../engine", features = ["duckdb-native"] }
analytics-factor = { path = "../factor" }
analytics-ml = { path = "../ml", features = ["lightgbm-native", "duckdb-native"] }
analytics-storage = { path = "../storage" }
chrono.workspace = true
eframe.workspace = true
egui.workspace = true
egui_extras.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
analytics-workflow = { path = "../workflow", features = ["test-support"] }
tempfile = "3.23"

