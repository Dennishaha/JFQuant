[project]
name = "jfquant-collectors"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["requests==2.32.5", "pandas==2.3.3", "pypdf==5.9.0", "tdxaidata==1.2.2"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jfquant_collectors*"]

[tool.ruff]
target-version = "py312"
line-length = 100
