[package]
name = "analytics-workflow"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
test-support = []

[dependencies]
analytics-engine = { path = "../engine", features = ["duckdb-native"] }
analytics-core = { path = "../core" }
analytics-storage = { path = "../storage" }
analytics-factor = { path = "../factor" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
chrono.workspace = true
uuid.workspace = true
rustix = { version = "1", features = ["process"] }

arrow-array.workspace = true
arrow-schema.workspace = true
parquet.workspace = true
thiserror.workspace = true
rust_decimal = { version = "=1.43.0", default-features = false, features = ["std", "serde-with-str"] }

tempfile = "3.23"
