[package]
name = "analytics-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "jfquant"
path = "src/main.rs"

[dependencies]
analytics-storage = { path = "../storage" }
analytics-core = { path = "../core" }
analytics-workflow = { path = "../workflow" }
analytics-ml = { path = "../ml", features = ["lightgbm-native", "duckdb-native"] }
analytics-factor = { path = "../factor" }
clap = { version = "4", features = ["derive", "env"] }
serde.workspace = true
serde_json.workspace = true
uuid.workspace = true

[dev-dependencies]
rustix = { version = "1", features = ["process"] }
flate2 = "1.1"
tar = "0.4"
sha2.workspace = true
analytics-storage = { path = "../storage" }
analytics-workflow = { path = "../workflow", features = ["test-support"] }
tempfile = "3.23"
