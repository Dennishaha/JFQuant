[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/storage",
    "crates/engine",
    "crates/factor",
    "crates/app",
    "crates/workflow",
    "crates/cli",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1.0"
arrow = "60.0.0"
arrow-array = "60.0.0"
arrow-schema = "60.0.0"
chrono = { version = "0.4", features = ["serde"] }
eframe = "0.36.2"
egui = "0.36.2"
egui_extras = "0.36.2"
parquet = "60.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["raw_value"] }
sha2 = "0.10"
thiserror = "2.0"
uuid = { version = "1.18", features = ["serde", "v4"] }

# Keep native research loops usable from the development/VS Code build.
[profile.dev.package.analytics-factor]
opt-level = 3

[profile.dev.package.analytics-workflow]
opt-level = 2

